[package]
name = "csvdb"
version.workspace = true
edition.workspace = true
description = "Convert between SQLite/DuckDB databases and CSV directories"
license = "MIT"
repository = "https://github.com/jeff-gorelick/csvdb"
readme = "../README.md"
keywords = ["csv", "sqlite", "duckdb", "parquet", "git"]
categories = ["command-line-utilities", "database"]
exclude = ["CLAUDE.md", "tests/"]

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
duckdb = { version = "1.4", features = ["bundled"] }
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
toml = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
tempfile = "3"
flate2 = "1"
notify = "8"
comfy-table = "7"
arrow = { version = "56", default-features = false, features = ["prettyprint"] }
regex = "1"
rayon = "1.10"
