name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test

      - uses: astral-sh/setup-uv@v4

      - name: Run functional tests
        run: uv run pytest
        working-directory: tests/functional
