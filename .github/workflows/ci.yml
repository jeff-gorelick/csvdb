name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v4

      - name: Run Rust tests (core)
        run: cargo test --release -p csvdb ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}

      - name: Run FFI tests
        run: cargo test --release -p csvdb-ffi ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}

      - name: Run Python binding tests
        working-directory: csvdb-python
        run: |
          uv sync
          uv run maturin develop --release
          uv run pytest
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Run functional tests
        run: uv run pytest
        working-directory: tests/functional

      - name: Build FFI shared library (for Perl tests)
        run: cargo build --release -p csvdb-ffi

      - name: Install Perl dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus
          sudo cpanm -n FFI::Platypus

      - name: Install Perl dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cpanminus libffi
          LDFLAGS="-L/opt/homebrew/opt/libffi/lib" \
          CPPFLAGS="-I/opt/homebrew/opt/libffi/include" \
          cpanm -n FFI::Platypus

      - name: Install Perl dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cpanm -n Alien::FFI
          cpanm -n -v FFI::Platypus || (for /R C:\Users\RUNNER~1\.cpanm\work /F %%f in (build.log) do type "%%f") && exit /b 1

      - name: Run Perl tests
        run: prove perl/t/
