name: CI

on:
  push:
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7

      - name: Run Rust tests (core)
        run: cargo test --release -p csvdb ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}

      - name: Run FFI tests
        run: cargo test --release -p csvdb-ffi ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}

      - name: Run Python binding tests
        working-directory: csvdb-python
        run: |
          uv sync
          uv run maturin develop --release
          uv run pytest
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Lint Python tests (ruff)
        run: uv run --with ruff ruff check .
        working-directory: tests/functional

      - name: Lint Python binding tests (ruff)
        run: uv run --with ruff ruff check tests/
        working-directory: csvdb-python

      - name: Run functional tests
        run: uv run pytest
        working-directory: tests/functional

      - name: Build FFI shared library (for Perl tests)
        run: cargo build --release -p csvdb-ffi

      - name: Install Perl dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus
          sudo cpanm -n FFI::Platypus Perl::Critic

      - name: Install Perl dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cpanminus libffi
          LDFLAGS="-L/opt/homebrew/opt/libffi/lib" \
          CPPFLAGS="-I/opt/homebrew/opt/libffi/include" \
          cpanm -n FFI::Platypus

      - name: Install Perl dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cpanm -n Alien::FFI
          cpanm -n -v FFI::Platypus || (for /R C:\Users\RUNNER~1\.cpanm\work /F %%f in (build.log) do type "%%f") && exit /b 1

      - name: Lint Perl (perlcritic)
        if: runner.os == 'Linux'
        run: perlcritic --severity 4 perl/lib/ perl/t/

      - name: Run Perl tests
        run: prove perl/t/

  coverage:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean coverage data
        run: cargo llvm-cov clean --workspace

      - name: Run unit tests with coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo test --workspace --release

      - name: Build instrumented binary
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo build --release -p csvdb

      - name: Run functional tests with coverage
        working-directory: tests/functional
        run: |
          source <(cargo llvm-cov show-env --sh)
          uv run pytest -q --ignore=test_watch.py

      - name: Generate coverage report
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --release --lcov --output-path lcov.info
          cargo llvm-cov report --release 2>&1 | tee coverage-summary.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
