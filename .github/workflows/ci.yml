name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests (core)
        run: cargo test --release -p csvdb

      - name: Check FFI crate
        run: cargo check -p csvdb-ffi

      - name: Check Python crate
        run: cargo check -p csvdb-python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - uses: astral-sh/setup-uv@v4

      - name: Run functional tests
        run: uv run pytest
        working-directory: tests/functional
