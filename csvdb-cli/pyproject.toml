[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "csvdb-cli"
dynamic = ["version"]
description = "CLI tool to convert between SQLite, DuckDB, CSV, and Parquet"
requires-python = ">=3.8"
readme = "README.md"
license = "MIT"
authors = [{name = "Jeff Gorelick", email = "jeffrey.gorelick@gmail.com"}]
keywords = ["csv", "sqlite", "duckdb", "parquet", "database", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/jeff-gorelick/csvdb"
Issues = "https://github.com/jeff-gorelick/csvdb/issues"

[tool.maturin]
manifest-path = "../csvdb/Cargo.toml"
bindings = "bin"
strip = true
