[package]
name = "csvdb-ffi"
version.workspace = true
edition = "2021"
description = "C FFI bindings for csvdb"
license = "MIT"
repository = "https://github.com/jeff-gorelick/csvdb"

[lib]
name = "csvdb_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
csvdb = { path = "../csvdb" }
csv = "1.3"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
