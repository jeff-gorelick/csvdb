[package]
name = "csvdb"
version = "0.1.1"
edition = "2021"
description = "Convert between SQLite/DuckDB databases and CSV directories"
license = "MIT"
repository = "https://github.com/jeff-gorelick/csvdb"
readme = "README.md"
keywords = ["csv", "sqlite", "duckdb", "git", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.4", features = ["bundled"] }
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
indicatif = "0.17"
tempfile = "3"
