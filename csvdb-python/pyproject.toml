[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "csvdb-py"
dynamic = ["version"]
description = "Python bindings for csvdb: convert between SQLite, DuckDB, CSV, and Parquet"
requires-python = ">=3.8"
readme = "README.md"
license = "MIT"
authors = [{name = "Jeff Gorelick", email = "jeffrey.gorelick@gmail.com"}]
keywords = ["csv", "sqlite", "duckdb", "parquet", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/jeff-gorelick/csvdb"
Issues = "https://github.com/jeff-gorelick/csvdb/issues"

[project.optional-dependencies]
arrow = ["pyarrow>=12"]
pandas = ["pandas>=1.5", "pyarrow>=12"]
polars = ["polars>=0.19", "pyarrow>=12"]
all = ["pandas>=1.5", "polars>=0.19", "pyarrow>=12"]

[dependency-groups]
dev = ["pytest>=7.0", "maturin>=1,<2", "pyarrow>=12", "pandas>=1.5", "polars>=0.19"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "csvdb"

[tool.maturin.environment]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
